# Optional: generates an animated contribution snake for the profile README.
# Enable Actions on Saad10922/Saad10922, then add this image to README.md:
# <img src="https://raw.githubusercontent.com/Saad10922/Saad10922/output/github-contribution-grid-snake.svg" alt="Snake animation" />

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Saad10922
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
